<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>投研助手</title>
  <link rel="stylesheet" href="assets/chat/chat.css?v=__ASSET_V__" />
</head>
<body>
  <!-- 嵌入宿主时才显示：标题 + 当前登录用户 + 关闭（关闭是发消息让宿主收窗） -->
  <header class="widget-header">
    <span class="dot" id="conn-dot" title="服务状态"></span>
    <span class="title" id="widget-title">投研助手</span>
    <span class="who" id="widget-who"></span>
    <button type="button" id="widget-close" title="关闭" aria-label="关闭">×</button>
  </header>

  <main id="chat-container">
    <span class="mock-badge">MOCK 登录态</span>
    <div class="auth-gate" id="auth-gate">
      <div class="spinner"></div>
      <p class="msg" id="auth-gate-msg">正在获取登录态…</p>
    </div>
  </main>

  <footer class="composer">
    <!-- 本地调试用。嵌入宿主后由登录态接管，CSS 里已隐藏 -->
    <div class="identity-bar">
      <label>
        用户 ID<span title="调试用；嵌入后由宿主登录态提供">（调试）</span>
        <input id="user-id" autocomplete="off" spellcheck="false" />
      </label>
    </div>
    <div id="pending-files" class="pending-files" aria-live="polite"></div>
    <div class="composer-inner">
      <input id="file-input" type="file" multiple hidden />
      <button id="attach-btn" type="button" title="添加附件" aria-label="添加附件"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg></button>
      <textarea
        id="message-input"
        rows="1"
        placeholder="输入问题，可附带文件…"
        enterkeyhint="send"
      ></textarea>
      <button id="send-btn" type="button" aria-label="发送">↑</button>
    </div>
  </footer>

  <!-- 本地资源（原为 cdn.jsdelivr.net，内网取不到）。仍保留 async + onerror：
       文件缺失时走内置兜底渲染，不白屏。
       **用相对路径**：本页在 / 下是 /assets/…，在 /csagent/ 下就是
       /csagent/assets/…，前缀由页面 URL 决定，不用写死。 -->
  <!-- marked v15 用了 ES2022 的 Array/String.prototype.at()，微信 Android 的
       X5 内核（Chrome 86）没有这个方法，一渲染就抛 "t.at is not a function"。
       内联脚本按文档顺序立即执行，async 的 marked 只会在它之后跑，顺序安全。 -->
  <script>
    (function () {
      function at(n) {
        n = Math.trunc(n) || 0;
        if (n < 0) n += this.length;
        return n < 0 || n >= this.length ? undefined : this[n];
      }
      if (!Array.prototype.at) {
        Object.defineProperty(Array.prototype, "at", {
          value: at, writable: true, configurable: true
        });
      }
      if (!String.prototype.at) {
        Object.defineProperty(String.prototype, "at", {
          value: function (n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            return n < 0 || n >= this.length ? undefined : this.charAt(n);
          },
          writable: true, configurable: true
        });
      }
    })();
  </script>

  <script async src="assets/marked.min.js"
          onerror="window.__mdCdnFailed=true"></script>
  <script async src="assets/purify.min.js"
          onerror="window.__mdCdnFailed=true"></script>
  <!-- 页面逻辑。普通脚本（非 module），按文档顺序在上面的 polyfill 之后执行。
       ?v= 由服务端按文件内容替换，发版后宿主 webview 不会吃旧缓存。 -->
  <!-- 回答排版后处理（红涨绿跌），app.js 的 renderMarkdown 会调它 -->
  <script src="assets/chat/format.js?v=__ASSET_V__"></script>
  <script src="assets/chat/app.js?v=__ASSET_V__"></script>
  <!-- 报告卡片 / 报告面板 / 文件卡片，用到 app.js 的全局 -->
  <script src="assets/chat/report.js?v=__ASSET_V__"></script>
  <!-- 快捷入口（欢迎区 / 标签栏 / 抽屉），用到 app.js 的全局，必须在它之后 -->
  <script src="assets/chat/entries.js?v=__ASSET_V__"></script>
</body>
</html>
