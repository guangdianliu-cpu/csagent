      近1年最大回撤(%): {type: number, filterable: true, sortable: true, ops: [gt, gte, lt, lte]}
      近1年年化夏普: {type: number, filterable: true, sortable: true, ops: [gt, gte, lt, lte]}
      收益评分: {type: number, filterable: true, sortable: true, ops: [gt, gte, lt, lte]}
      风控评分: {type: number, filterable: true, sortable: true, ops: [gt, gte, lt, lte]}
      回撤评分: {type: number, filterable: true, sortable: true, ops: [gt, gte, lt, lte]}
