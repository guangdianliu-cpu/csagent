# 利得基金研究数据库 · Catalog 配置
#
# 只声明"研究场景下大概率会筛选/排序"的核心字段（filterable/sortable）；
# 完整列清单（含风格暴露因子、行业占比等长尾列）用 `query.py --action fields` 现查，
# 或直接 select 出来——select 不受本文件字段清单限制，按实际 SQLite 表结构校验。
#
# 字段含义见 ../references/field-dictionary.md 与 ../references/methodology-*.md

entities:
  active_bond_funds:
    domain: fund_research
    description: 主动纯债型基金（利得一级分类）研究数据库，覆盖分类标签/评分/久期杠杆/持有体验等
    default_limit: 20
    max_rows: 200
    default_order_by:
      field: 综合评分
      direction: desc
    fields:
      基金代码:
        type: string
        filterable: true
        sortable: true
        ops: [eq, in]
        description: 主键，形如 000001.OF
      基金简称:
        type: string
        filterable: true
        sortable: true
        ops: [eq, like]
        description: 基金名称（份额级）
      Wind二级分类:
        type: string
        filterable: true
        ops: [eq, in, like]
        description: 万得原始分类，是利得分类的输入而非结果
      利得二级分类:
        type: string
        filterable: true
        ops: [eq, in]
        values: {偏利率策略: 偏利率策略, 偏信用策略: 偏信用策略}
      利得三级分类:
        type: string
        filterable: true
        ops: [eq, in]
        description: 摊余债基/短期纯债基/利率债基/金融信用债基/中低等级信用债基/中高等级信用债基/灵活配置债基
      基金公司:
        type: string
        filterable: true
        ops: [eq, in, like]
      基金经理:
        type: string
        filterable: true
        ops: [like]
      成立日期:
        type: date
        filterable: true
        sortable: true
        ops: [gte, lte, eq]
      是否定开:
        type: string
        filterable: true
        ops: [eq]
        values: {是: 定期开放, 否: 非定开}
      基金规模(合计)(亿元):
        type: number
        filterable: true
        sortable: true
        ops: [eq, gt, gte, lt, lte]
      基金规模评价:
        type: string
        filterable: true
        ops: [eq, in]
        values: {偏小: "<10亿", 中等: "10-100亿", 偏大: ">=100亿"}
      申购状态:
        type: string
        filterable: true
        ops: [eq, in]
      近1年收益(%):
        type: number
        filterable: true
        sortable: true
        ops: [eq, gt, gte, lt, lte]
      近1年年化波动率(%):
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      近1年最大回撤(%):
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      近1年年化夏普:
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      收益评分:
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      风控评分:
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      回撤评分:
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      投资效率评分:
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      投资经验评分:
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      综合评分:
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
        description: 20%×(收益+风控+回撤+投资效率+投资经验)评分，同三级分类内排名标准化，跨三级分类不可比
      本期久期风格:
        type: string
        filterable: true
        ops: [eq, in]
        values: {短: "<1年", 中短: "1-3年", 中长: "3-5年", 长: ">=5年"}
      当期久期(年):
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      杠杆率风格:
        type: string
        filterable: true
        ops: [eq, in]
        values: {低: "<110%", 中: "110-130%", 高: ">=130%"}
      本期杠杆率(%):
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      机构占比(%):
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      机构持有风格:
        type: string
        filterable: true
        ops: [eq, in]
        values: {低: "<40%", 中等: "40-70%", 高: ">=70%"}
      是否含转债:
        type: string
        filterable: true
        ops: [eq]
      真实权益仓位(%):
        type: number
        filterable: true
        sortable: true
        ops: [gt, gte, lt, lte]
      主要收益来源:
        type: string
        filterable: true
        ops: [eq, in]
      适配情景:
        type: string
        filterable: true
        ops: [like]
      不适配情景:
        type: string
        filterable: true
        ops: [like]

  active_equity_funds:
