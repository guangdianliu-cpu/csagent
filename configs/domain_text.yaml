# configs/domain_text.yaml — 产品领域层文案与结构化配置
# 核心代码只引用常量名，本文件集中维护所有领域口径。
# 判断标准：换一个行业要改的东西，就该在这个文件里。
#
# 本产品：默认产品咨询客服 — 代销基金净值/费率/限额/开放期等对客查询。
# 形态差异写在 configs/profiles/<形态>/profile.yaml 的 domain_text 段（AGENT_PROFILE 选择）。

# ---------------------------------------------------------------- 文案

# 用户只发文件、一个字没打时注入的默认指令。
file_only_instruction: |-
  用户只发送了文件，未附任何文字说明。请先判断文件性质再决定动作：
  - 含基金代码 / 产品名单 → 先读出代码列表，再按产品咨询口径逐只查询（净值、代销、可否购买等），不要做投资建议
  - 其它文件 → 先说明你读到了什么，再问用户希望查询哪只产品的哪项信息
  无论走哪条，都要在回复开头用一句话说明你采取的默认假设，并告知可以改成别的处理方式。

# 附件已入库时，附在「工作区路径」后面的处理提示（会点名领域 Skill）。
attachment_usage_hint: >-
  本轮附件路径见上。可读 list_dir / read_file；名单里的基金代码用 fund-product-query 查询。
  对客回复只陈述事实，勿覆盖 inbound 原件。用户后续说「这个文件」且未另指时，才用会话里的
  当前用户文件指针；普通提问勿强行关联旧附件。

# 附件没取到时的提示（不得点名不存在的 Skill，故与上一条分开）。
attachment_lost_hint: >-
  工作区中没有这份文件，read_file 等工具都无法处理它。不要用其它文件顶替。

# 用户在企微里发了空消息/不支持的消息类型时的引导语。
empty_inbound_guide: >-
  您好，我在的。可以问代销基金的净值、费率、限额、开放期或能不能买，把 6 位基金代码发给我即可。

# ReAct 兜底答复（超时 / 无法完成）。
fallback_timeout_answer: 抱歉，本次查询耗时过长，请稍后重试。
fallback_failed_answer: 抱歉，暂时无法完成查询，请稍后重试。

# 通道级兜底答复（消息没送出去，而非答不出来）。
handle_timeout_reply: 处理超时，请稍后重试。
transport_failure_reply: 网络不太稳定，这条消息没能正常送达，麻烦重发一次。
handle_failed_reply: "处理失败：{error}"

# 转人工工具的描述。
handoff_tool_description: 当你无法解决用户问题、需要转交人工处理时调用此工具。

# 历史压缩器的系统提示词。
memory_summarizer_prompt: |-
  你是产品咨询会话记忆压缩器。把给定的早期对话压缩成简洁的中文摘要，规则：
  1. 必须保留：用户诉求、基金代码（6位数字）、客户类型（机构/个人）、金额/份额/费率数字、已确认的结论、待办与约束；
  2. 丢弃：寒暄、重复内容、过程性中间讨论、长表格与完整名单；
  3. 用「- 」开头的要点列表输出，每条尽量短，不要输出其他说明文字；
  4. 若提供了「已有摘要」，把新对话合并进去，输出合并后的完整摘要。

# web_search 结果的免责补充。
web_search_note: 结果仅作参考，涉及产品费率/净值/限额须以产品中心查询为准。

# ---------------------------------------------------------------- 结构

# 超大 JSON 工具结果压缩时，按实体名保留的关键字段。
json_preview_keys:
  fund:
    - fund_code
    - fund_name
    - consign_flag
    - fundstate
    - buystatus
    - nav

# ---------------------------------------------------------------- 记忆层词表

# 记忆/压缩/召回层的领域词表；通用源码只引用常量名。
memory_domain:
  entity_patterns:
    - "(?<!\\d)(\\d{6})(?!\\d)"  # 6 位基金代码
  stopwords:
    - 基金
    - 查询
    - 筛选
    - 结果
    - 回答
    - 问题
