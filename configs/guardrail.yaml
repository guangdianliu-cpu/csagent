# configs/guardrail.yaml — Guardrail 规则引擎配置（M2.1）
#
# action 语义：
#   input_rules  ：block(拦截) | warn(记录不拦截) | log(仅记录)
#   output_rules ：mask(脱敏后放行) | block(拦截) | warn(记录不拦截)
#
# 改此文件即可启停规则，无需改代码（红线约束：配置优先）。

guardrail:
  enabled: true

  input_rules:
    # Prompt 注入检测：命中即拦截，提示用户换一种问法
    - name: prompt_injection
      enabled: true
      action: block
      patterns:
        - "忽略以上指令"
        - "忽略之前的指令"
        - "忽略(以上|之前|上述|前面)(的)?(所有)?(指令|规则|提示|限制)"
        - "ignore\\s+(all\\s+)?(previous|above)\\s+(instructions?|rules?)"
        - "你现在是.*不是.*助手"
        - "(输出|告诉我|展示)你的(系统提示词|system prompt)"
        - "system prompt"
        - "repeat.*instructions"
      keywords: []

    # 超长输入拦截，防止异常大请求拖垮下游 LLM 调用
    - name: max_length
      enabled: true
      action: block
      max_chars: 50000

  # 输出规则同时作用于流式推送的正文与思考过程（逐段处理，见 guardrail/output_guard.py），
  # 不是等全文生成完再处理——那时原文早已推给客户端。
  # mask 规则按顺序依次应用：长号码在前，手机号最后，并且都带数字边界，
  # 否则手机号规则会先咬进身份证号中间，把身份证切坏后漏出前几位。
  output_rules:
    # PII 脱敏：命中即替换后放行（不拦截，只脱敏）
    - name: pii_id_card
      enabled: true
      action: mask
      pattern: '(?<!\d)\d{17}[\dXx](?![\dXx])'
      mask_with: "****"

    - name: pii_bank_card
      enabled: true
      action: mask
      pattern: '(?<!\d)\d{16,19}(?!\d)'
      mask_with: "****"

    - name: pii_phone
      enabled: true
      action: mask
      pattern: '(?<!\d)1[3-9]\d{9}(?!\d)'
      mask_with: "1***"

    # 已知密钥值：启动时从 .env / 进程环境收集名字像密钥的变量值
    # （KEY / SECRET / TOKEN / PASSWORD…，长度 >= 12），回复里原样出现就替换。
    # 不写 pattern；值不进任何日志。同一批值也会在工具结果进模型上下文前被遮掉。
    - name: secret_values
      enabled: true
      action: mask
      source: env_secrets
      mask_with: "[已屏蔽]"

    # 敏感关键词：只记录告警，不拦截、不改写正文
    - name: sensitive_keywords
      enabled: true
      action: warn
      keywords:
        - "密码"
        - "密钥"
        - "private key"
        - "secret"
